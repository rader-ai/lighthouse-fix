  <polyline points="0,443.9 40,439.7 80,439.6 120,442.2 160,445.0 200,445.7 240,444.3 280,442.7 320,443.5 360,448.0 400,455.4 440,462.8 480,467.2 520,467.6 560,465.0 600,462.0 640,461.0 680,462.2" fill="none" stroke="#D3DFDD" stroke-width="1.2"/>
