<g class="p0"><text class="mono" x="92" y="182" font-size="15" font-weight="700" fill="#E8EEF0" xml:space="preserve"># Fix the Scripts (first- and third-party JS) findings from a Lighthouse report</text></g>
<g class="p1"><text class="mono" x="92" y="207" font-size="15" font-weight="700" fill="#F5B84A" xml:space="preserve">## Context</text></g>
<g class="p2"><text class="mono" x="92" y="232" font-size="15" font-weight="400" fill="#E8EEF0" xml:space="preserve">Real visitors (Chrome UX Report, p75): LCP 1700 ms (good), INP 287 ms (needs-improvement).</text></g>
<g class="m3"><rect x="78" y="239" width="1124" height="25" rx="5" fill="#3A2D14"/><rect x="78" y="239" width="3" height="25" fill="#F5B84A"/><text class="mono" x="1188" y="257" font-size="12.5" font-weight="700" text-anchor="end" fill="#F5B84A">← real visitors first</text></g><g class="p3"><text class="mono" x="92" y="257" font-size="15" font-weight="400" fill="#E8EEF0" xml:space="preserve">Failing for real users: INP. Fix those first.</text></g>
<g class="p4"><text class="mono" x="92" y="282" font-size="15" font-weight="400" fill="#E8EEF0" xml:space="preserve">Platform: WordPress. Fixes go in the theme, functions.php or plugin settings.</text></g>
<g class="p5"><text class="mono" x="92" y="307" font-size="15" font-weight="700" fill="#F5B84A" xml:space="preserve">## Guardrails</text></g>
<g class="m6"><rect x="78" y="314" width="1124" height="25" rx="5" fill="#3A2D14"/><rect x="78" y="314" width="3" height="25" fill="#F5B84A"/><text class="mono" x="1188" y="332" font-size="12.5" font-weight="700" text-anchor="end" fill="#F5B84A">← keeps things working</text></g><g class="p6"><text class="mono" x="92" y="332" font-size="15" font-weight="400" fill="#E8EEF0" xml:space="preserve">- A/B tests: every variant still renders and is still tracked.</text></g>
<g class="p7"><text class="mono" x="92" y="357" font-size="15" font-weight="400" fill="#E8EEF0" xml:space="preserve">- Code owned by another team: change how it loads, not what it does.</text></g>
<g class="p8"><text class="mono" x="92" y="382" font-size="15" font-weight="700" fill="#F5B84A" xml:space="preserve">## Cards</text></g>
<g class="p9"><text class="mono" x="92" y="407" font-size="15" font-weight="700" fill="#F5B84A" xml:space="preserve">### F1 · Outside services (tags, chat, analytics) slow the page.</text></g>
<g class="p10"><text class="mono" x="92" y="432" font-size="15" font-weight="400" fill="#E8EEF0" xml:space="preserve">Moves: TBT, INP, LCP · Owner: marketing-ops · Rank 1 of 20</text></g>
<g class="p11"><text class="mono" x="92" y="457" font-size="15" font-weight="400" fill="#E8EEF0" xml:space="preserve">- googletagmanager.com/gtag/js | 176 KiB | 237 ms</text></g>
<g class="p12"><text class="mono" x="92" y="482" font-size="15" font-weight="400" fill="#E8EEF0" xml:space="preserve">Preferred fix: load after interaction or on consent; remove unused tags.</text></g>
<g class="m13"><rect x="78" y="489" width="1124" height="25" rx="5" fill="#3A2D14"/><rect x="78" y="489" width="3" height="25" fill="#F5B84A"/><text class="mono" x="1188" y="507" font-size="12.5" font-weight="700" text-anchor="end" fill="#F5B84A">← owner signs off</text></g><g class="p13"><text class="mono" x="92" y="507" font-size="15" font-weight="400" fill="#E8EEF0" xml:space="preserve">Avoid: Never silently remove tracking; list it for the owner to approve.</text></g>
<g class="m14"><rect x="78" y="514" width="1124" height="25" rx="5" fill="#3A2D14"/><rect x="78" y="514" width="3" height="25" fill="#F5B84A"/><text class="mono" x="1188" y="532" font-size="12.5" font-weight="700" text-anchor="end" fill="#F5B84A">← a check the agent runs</text></g><g class="p14"><text class="mono" x="92" y="532" font-size="15" font-weight="400" fill="#E8EEF0" xml:space="preserve">Done when: Third-party main-thread time drops.</text></g>
