<svg xmlns="http://www.w3.org/2000/svg" width="640" height="690" viewBox="0 0 640 690" role="img" aria-labelledby="t d">
<title id="t">How lighthouse-fix works</title>
<desc id="d">Five steps: your report, real-visitor triage, ranking, fix prompts, and routing each fix to its owner.</desc>
<style>

.mono { font-family: ui-monospace,'SF Mono',Menlo,Consolas,monospace; }
.serif { font-family: 'Iowan Old Style','Charter','Palatino Linotype',Georgia,serif; }
.ship { animation: ship 7s cubic-bezier(.6,0,.4,1) infinite both; }
@keyframes ship { 0% { transform: translateY(0); opacity: 0; } 5% { opacity: 1; } 85% { transform: translateY(512px); opacity: 1; } 100% { transform: translateY(512px); opacity: 0; } }

.s0 { animation: s0 7s linear infinite both; }
@keyframes s0 { 0%,3.0% { fill: #EEF2F1; } 6.0%,96% { fill: #E39A2D; } 100% { fill: #EEF2F1; } }
.s1 { animation: s1 7s linear infinite both; }
@keyframes s1 { 0%,23.0% { fill: #EEF2F1; } 26.0%,96% { fill: #E39A2D; } 100% { fill: #EEF2F1; } }
.s2 { animation: s2 7s linear infinite both; }
@keyframes s2 { 0%,43.0% { fill: #EEF2F1; } 46.0%,96% { fill: #E39A2D; } 100% { fill: #EEF2F1; } }
.s3 { animation: s3 7s linear infinite both; }
@keyframes s3 { 0%,63.0% { fill: #EEF2F1; } 66.0%,96% { fill: #E39A2D; } 100% { fill: #EEF2F1; } }
.s4 { animation: s4 7s linear infinite both; }
@keyframes s4 { 0%,83.0% { fill: #EEF2F1; } 86.0%,96% { fill: #E39A2D; } 100% { fill: #EEF2F1; } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<rect width="640" height="690" rx="18" fill="#EEF2F1"/>
<g>
  <polyline points="0,59.1 40,65.7 80,69.5 120,69.5 160,66.9 200,64.6 240,64.4 280,66.6 320,69.2 360,69.4 400,65.9 440,59.4 480,52.8 520,48.7 560,48.5 600,51.0 640,53.6 680,54.0" fill="none" stroke="#D3DFDD" stroke-width="1.2"/>
  <polyline points="0,174.4 40,177.3 80,175.7 120,171.4 160,167.2 200,165.0 240,164.9 280,164.7 320,162.0 360,156.0 400,148.1 440,141.2 480,138.0 520,139.4 560,143.8 600,148.2 640,150.6 680,150.9" fill="none" stroke="#D3DFDD" stroke-width="1.2"/>
