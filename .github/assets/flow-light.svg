<text class="mono" x="64" y="56" font-size="13" letter-spacing="2" fill="#5B6F7C">HOW A REPORT BECOMES FIXES</text>
<line x1="128" y1="128" x2="1152" y2="128" stroke="#A9B8BF" stroke-width="2" stroke-dasharray="6 7"/>
<circle class="s0" cx="128" cy="128" r="15" fill="#E39A2D" stroke="#E39A2D" stroke-width="3"/>
<text class="mono" x="128" y="133" font-size="13" font-weight="700" text-anchor="middle" fill="#13293D">1</text>
<text class="serif" x="128" y="184" font-size="23" text-anchor="middle" fill="#13293D">Your report</text>
<text class="mono" x="128" y="216" font-size="15" text-anchor="middle" fill="#5B6F7C">JSON, text, screenshot</text>
<text class="mono" x="128" y="238" font-size="15" text-anchor="middle" fill="#5B6F7C">or just a URL</text>
<circle class="s1" cx="384" cy="128" r="15" fill="#E39A2D" stroke="#E39A2D" stroke-width="3"/>
<text class="mono" x="384" y="133" font-size="13" font-weight="700" text-anchor="middle" fill="#13293D">2</text>
<text class="serif" x="384" y="184" font-size="23" text-anchor="middle" fill="#13293D">Real visitors</text>
<text class="mono" x="384" y="216" font-size="15" text-anchor="middle" fill="#5B6F7C">Chrome UX field data</text>
<text class="mono" x="384" y="238" font-size="15" text-anchor="middle" fill="#5B6F7C">decides what matters</text>
<circle class="s2" cx="640" cy="128" r="15" fill="#E39A2D" stroke="#E39A2D" stroke-width="3"/>
<text class="mono" x="640" y="133" font-size="13" font-weight="700" text-anchor="middle" fill="#13293D">3</text>
<text class="serif" x="640" y="184" font-size="23" text-anchor="middle" fill="#13293D">Rank</text>
<text class="mono" x="640" y="216" font-size="15" text-anchor="middle" fill="#5B6F7C">by savings, and by how</text>
<text class="mono" x="640" y="238" font-size="15" text-anchor="middle" fill="#5B6F7C">badly a metric fails</text>
<circle class="s3" cx="896" cy="128" r="15" fill="#E39A2D" stroke="#E39A2D" stroke-width="3"/>
<text class="mono" x="896" y="133" font-size="13" font-weight="700" text-anchor="middle" fill="#13293D">4</text>
<text class="serif" x="896" y="184" font-size="23" text-anchor="middle" fill="#13293D">Fix prompts</text>
<text class="mono" x="896" y="216" font-size="15" text-anchor="middle" fill="#5B6F7C">one per area, or one</text>
<text class="mono" x="896" y="238" font-size="15" text-anchor="middle" fill="#5B6F7C">all-in-one prompt</text>
<circle class="s4" cx="1152" cy="128" r="15" fill="#E39A2D" stroke="#E39A2D" stroke-width="3"/>
<text class="mono" x="1152" y="133" font-size="13" font-weight="700" text-anchor="middle" fill="#13293D">5</text>
<text class="serif" x="1152" y="184" font-size="23" text-anchor="middle" fill="#13293D">Right owner</text>
<text class="mono" x="1152" y="216" font-size="15" text-anchor="middle" fill="#5B6F7C">developer, marketing ops</text>
<text class="mono" x="1152" y="238" font-size="15" text-anchor="middle" fill="#5B6F7C">or CMS owner</text><circle class="ship" cx="128" cy="128" r="6" fill="#13293D"/>
</svg>
