<text class="mono" x="40" y="56" font-size="13" letter-spacing="2" fill="#5B6F7C">HOW A REPORT BECOMES FIXES</text>
<line x1="70" y1="124" x2="70" y2="636" stroke="#A9B8BF" stroke-width="2" stroke-dasharray="6 7"/>
<circle class="s0" cx="70" cy="124" r="15" fill="#E39A2D" stroke="#E39A2D" stroke-width="3"/>
<text class="mono" x="70" y="129" font-size="13" font-weight="700" text-anchor="middle" fill="#13293D">1</text>
<text class="serif" x="110" y="132" font-size="26" fill="#13293D">Your report</text>
<text class="mono" x="110" y="160" font-size="16" fill="#5B6F7C">JSON, text, screenshot or just a URL</text>
<circle class="s1" cx="70" cy="252" r="15" fill="#E39A2D" stroke="#E39A2D" stroke-width="3"/>
<text class="mono" x="70" y="257" font-size="13" font-weight="700" text-anchor="middle" fill="#13293D">2</text>
<text class="serif" x="110" y="260" font-size="26" fill="#13293D">Real visitors</text>
<text class="mono" x="110" y="288" font-size="16" fill="#5B6F7C">Chrome UX field data decides what matters</text>
<circle class="s2" cx="70" cy="380" r="15" fill="#E39A2D" stroke="#E39A2D" stroke-width="3"/>
<text class="mono" x="70" y="385" font-size="13" font-weight="700" text-anchor="middle" fill="#13293D">3</text>
<text class="serif" x="110" y="388" font-size="26" fill="#13293D">Rank</text>
<text class="mono" x="110" y="416" font-size="16" fill="#5B6F7C">by savings, and by how badly a metric fails</text>
<circle class="s3" cx="70" cy="508" r="15" fill="#E39A2D" stroke="#E39A2D" stroke-width="3"/>
<text class="mono" x="70" y="513" font-size="13" font-weight="700" text-anchor="middle" fill="#13293D">4</text>
<text class="serif" x="110" y="516" font-size="26" fill="#13293D">Fix prompts</text>
<text class="mono" x="110" y="544" font-size="16" fill="#5B6F7C">one per area, or one all-in-one prompt</text>
<circle class="s4" cx="70" cy="636" r="15" fill="#E39A2D" stroke="#E39A2D" stroke-width="3"/>
<text class="mono" x="70" y="641" font-size="13" font-weight="700" text-anchor="middle" fill="#13293D">5</text>
<text class="serif" x="110" y="644" font-size="26" fill="#13293D">Right owner</text>
<text class="mono" x="110" y="672" font-size="16" fill="#5B6F7C">developer, marketing ops or CMS owner</text><circle class="ship" cx="70" cy="124" r="6" fill="#13293D"/>
</svg>
